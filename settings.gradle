rootProject.name = 'hangelo'

// Shared libraries.
include 'lib:model'   // JPA entities, enums, repositories, RND
include 'lib:jooq'    // jOOQ classes generated from the schema (make jooq)
include 'lib:web'     // what every REST module needs: errors, current user
include 'lib:mail'    // sending e-mail (Resend), and the look of our letters

// Database migrations (make upgradeDbAll).
include 'migration'

// Loads venues from the 2GIS directory into the table "place" (make places).
include 'place-import'

// Application "hangelo": the launcher builds the boot-jar, every feature is a module.
include 'applications:hangelo:hangelo-launcher'
include 'applications:hangelo:hangelo-mod:notification'
include 'applications:hangelo:hangelo-mod:reliability'
include 'applications:hangelo:hangelo-mod:calendar'
include 'applications:hangelo:hangelo-mod:analytics'
include 'applications:hangelo:hangelo-mod:auth'
include 'applications:hangelo:hangelo-mod:profile'
include 'applications:hangelo:hangelo-mod:friend'
include 'applications:hangelo:hangelo-mod:chat'
include 'applications:hangelo:hangelo-mod:event'
