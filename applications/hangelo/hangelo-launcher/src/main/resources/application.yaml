# Everything that differs between machines comes from environment variables with the prefix HANGELO_.
# There are no defaults here on purpose: local values live in build.gradle of this module (bootRun),
# and a server started without the variables fails at once instead of running with a known secret.

server:
  port: 29000 # "Rest Server hangelo" in the port table of CLAUDE.md
  tomcat:
    # How much of a refused (too large) upload is still read, so that the client gets our answer
    # instead of a broken connection. Larger than that - the connection is cut.
    max-swallow-size: 16MB

spring:
  application:
    name: hangelo
  datasource:
    url: ${HANGELO_DB_URL}
    username: ${HANGELO_DB_USER}
    password: ${HANGELO_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      # The schema is owned by the migrations (module `migration`). Hibernate only checks at startup
      # that the entities match it.
      ddl-auto: validate
  jooq:
    sql-dialect: postgres
  servlet:
    multipart:
      # The only upload is a profile photo. The same 6 MB is PhotoService.MAX_UPLOAD_BYTES;
      # the request may be a little larger than the file (the form around it).
      max-file-size: 6MB
      max-request-size: 7MB

hangelo:
  jwt:
    secret: ${HANGELO_JWT_SECRET}
    ttl: 30d
  mail:
    # Unlike the secrets above, these three may be absent - with a deliberate meaning each:
    # no key          = letters are not sent, only written to the log (a developer's machine);
    # no "from"       = Resend's test sender, which delivers only to the owner of the Resend account;
    # no public url   = links in letters point at the local UI.
    resend-api-key: ${HANGELO_RESEND_API_KEY:}
    from: ${HANGELO_MAIL_FROM:Hangelo <onboarding@resend.dev>}
    public-url: ${HANGELO_PUBLIC_URL:http://localhost:19000}
  demo-login:
    # Signing in as one of the two demonstration accounts by a link, with no password
    # (DemoLoginService). On unless switched off.
    enabled: ${HANGELO_DEMO_LOGIN:true}
  admin:
    # Who may see /admin/analytica: e-mails, separated by commas. Not set = the demonstration
    # account alone - so the page can be shown in a demo, and is closed to everyone else.
    emails: ${HANGELO_ADMIN_EMAILS:steve.jobs@hangelo.demo}
  timers:
    # The timers of the server: reminders about upcoming events (every ten minutes) and the expiry
    # of events whose dates are behind (every minute). The tests turn them off.
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
