# Everything that differs between machines comes from environment variables with the prefix MAGAIN_.
# There are no defaults here on purpose: local values live in build.gradle of this module (bootRun),
# and a server started without the variables fails at once instead of running with a known secret.

server:
  port: 29000 # "Rest Server magain" in the port table of CLAUDE.md
  tomcat:
    # How much of a refused (too large) upload is still read, so that the client gets our answer
    # instead of a broken connection. Larger than that - the connection is cut.
    max-swallow-size: 8MB

spring:
  application:
    name: magain
  datasource:
    url: ${MAGAIN_DB_URL}
    username: ${MAGAIN_DB_USER}
    password: ${MAGAIN_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      # The schema is owned by the migrations (module `migration`). Hibernate only checks at startup
      # that the entities match it.
      ddl-auto: validate
  jooq:
    sql-dialect: postgres
  servlet:
    multipart:
      # The only upload is a profile picture. The same 2 MB is AvatarService.MAX_UPLOAD_BYTES;
      # the request may be a little larger than the file (the form around it).
      max-file-size: 2MB
      max-request-size: 3MB

magain:
  jwt:
    secret: ${MAGAIN_JWT_SECRET}
    ttl: 30d

management:
  endpoints:
    web:
      exposure:
        include: health
