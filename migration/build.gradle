// Migrations: numbered SQL files in src/main/resources/db/migration, applied by Flyway.
// Append-only: a change is always a new file, an applied file is never edited.

dependencies {
    implementation libs.flywayCore
    implementation libs.flywayPostgresql
    runtimeOnly libs.postgresql
}

def migrate = { String taskName, String db ->
    tasks.register(taskName, JavaExec) {
        description = "Applies migrations to the database ${db}"
        group = 'database'
        classpath = sourceSets.main.runtimeClasspath
        mainClass = 'kz.nuraskhan.meet_again.migration.Migrate'
        args "jdbc:postgresql://localhost:20000/${db}", 'magain', 'magain'
    }
}

def local = migrate('upgradeLocalDb', 'magain')
def test = migrate('upgradeTestDb', 'magain_test')

tasks.register('upgradeDbAll') {
    description = 'Applies migrations to the local and the test database'
    group = 'database'
    dependsOn local, test
}

// Heroku: `gradlew stage` is what its buildpack runs. This part of it puts the migration program
// and its libraries into build/stage/migration, where the release command of the Procfile finds
// them under names that do not change with the version.
tasks.register('stage', Sync) {
    description = 'Copies the migration program and its libraries to build/stage/migration'
    group = 'distribution'
    from tasks.named('jar')
    from configurations.named('runtimeClasspath')
    into rootProject.layout.buildDirectory.dir('stage/migration')
}