// Typed access to the database for reading: classes generated by jOOQ from the live schema of the
// local database. They are committed, so a build does not need a database.
//
// Regenerate after every migration: `make jooq` (= dockerUp, upgradeDbAll, then jooqCodegen).

configurations {
    jooqCodegen
}

dependencies {
    api libs.starterJooq
    api project(':lib:model') // enum columns are read as the enums of the model

    jooqCodegen platform(libs.springBootBom)
    jooqCodegen libs.jooqCodegen
    jooqCodegen libs.postgresql
}

tasks.register('jooqCodegen', JavaExec) {
    description = 'Regenerates the jOOQ classes from the local database'
    group = 'database'
    classpath = configurations.jooqCodegen
    mainClass = 'org.jooq.codegen.GenerationTool'
    workingDir = projectDir
    args 'jooq-codegen.xml'
}
